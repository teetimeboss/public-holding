<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tee Time Boss | Temporarily Unavailable</title>
    <meta name="description" content="TeeTimeBoss is temporarily unavailable." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100vh;
        background: #fdfcf8;
        color: #1a1a1a;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        align-items: center;
        min-height: 100vh;
        width: 100%;
        max-width: 48rem;
        margin: 0 auto;
        padding: 6rem 1.5rem;
      }
      .card {
        width: 100%;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }
      .eyebrow {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.24em;
        color: #d4a90e;
      }
      h1 {
        margin: 1rem 0 0;
        font-size: 1.875rem;
        font-weight: 700;
        line-height: 1.25;
      }
      p.body {
        margin: 1.5rem 0 0;
        font-size: 1rem;
        line-height: 1.75rem;
        color: #374151;
      }
      p.body + p.body { margin-top: 1rem; }
      .bar {
        margin-top: 1.5rem;
        height: 0.375rem;
        width: 6rem;
        border-radius: 9999px;
        background: #f5c518;
      }
      @media (min-width: 640px) {
        h1 { font-size: 2.25rem; }
        p.body { font-size: 1.125rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <p class="eyebrow">Service Notice</p>
        <h1>TeeTimeBoss is temporarily unavailable</h1>
        <p class="body">
          We are currently going through a transitional investigation and the platform is
          temporarily unavailable.
        </p>
        <p class="body">We will be back once this process is complete.</p>
        <div class="bar"></div>
      </div>
    </main>
  </body>
</html>
